<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">

    <!-- Header -->
    {% include "header.html" %}

    <div class="content">

        <!-- Tabs -->
        <aside class="tabs">
            <button type="button" onclick="showTab('about')">About</button>
            <button type="button" onclick="showTab('projects')">Projects</button>
            <button type="button" onclick="showTab('skills')">Skills</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            {% include "about.html" %}
        </main>

        <!-- Feedback -->
        <section class="feedback" id="feedback-section">
            <h3>Suggestions / Feedback</h3>
            {% include "feedback_form.html" %}
            <div id="feedback-message" style="display:none; color: green; margin-top: 10px;"></div>
            <button id="reload-feedback-btn" style="display:none; margin-top:10px;">Submit Another Feedback</button>
        </section>

    </div>

    <!-- Footer -->
    {% include "footer.html" %}
    
</div>

<script>
    async function showTab(tab) {
        let url = "/" + tab;
        try {
            const response = await fetch(url);
            if (response.ok) {
                const html = await response.text();
                document.getElementById('main-content').innerHTML = html;
            } else {
                document.getElementById('main-content').innerHTML = "<p>Error loading content.</p>";
            }
        } catch (e) {
            document.getElementById('main-content').innerHTML = "<p>Error loading content.</p>";
        }
    }

    // Feedback form AJAX submission and reload logic
    document.addEventListener('DOMContentLoaded', function() {
        const feedbackSection = document.getElementById('feedback-section');
        let form = document.getElementById('feedback-form');
        const messageDiv = document.getElementById('feedback-message');
        const reloadBtn = document.getElementById('reload-feedback-btn');

        async function handleSubmit(e) {
            e.preventDefault();
            const formData = new FormData(form);
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (response.ok && data.message) {
                    form.style.display = 'none';
                    messageDiv.style.display = 'block';
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = data.message;
                    reloadBtn.style.display = 'inline-block';
                } else {
                    messageDiv.style.display = 'block';
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = data.message || 'Error submitting feedback.';
                }
            } catch (err) {
                messageDiv.style.display = 'block';
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Error submitting feedback.';
            }
        }

        if (form) {
            form.addEventListener('submit', handleSubmit);
        }

        reloadBtn.addEventListener('click', async function() {
            // Fetch the feedback form HTML and re-insert it
            const resp = await fetch('/static/../templates/feedback_form.html');
            // Instead, fetch from the server using AJAX and Jinja2 rendering
            // We'll use a dedicated endpoint for this:
            const response = await fetch('/feedback-form');
            if (response.ok) {
                const html = await response.text();
                // Remove old form if any
                if (form) form.remove();
                // Insert new form before the messageDiv
                messageDiv.insertAdjacentHTML('beforebegin', html);
                // Hide message and reload button
                messageDiv.style.display = 'none';
                reloadBtn.style.display = 'none';
                // Re-bind the submit event to the new form
                form = document.getElementById('feedback-form');
                if (form) {
                    form.addEventListener('submit', handleSubmit);
                }
            }
        });
    });
</script>

</body>
</html>
